services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spin
      POSTGRES_PASSWORD: spin
      POSTGRES_DB: spin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spin -d spin"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: installs dependencies into shared volumes and generates the Prisma client,
  # so api and web don't race each other running `pnpm install`.
  deps:
    build: { context: ., dockerfile: Dockerfile.dev }
    image: spin-dev
    volumes: &app-volumes
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - pnpm_store:/home/node/.pnpm-store
    command: sh -c "pnpm config set store-dir /home/node/.pnpm-store && pnpm install --frozen-lockfile && pnpm --filter api prisma:generate"

  api:
    image: spin-dev
    volumes: *app-volumes
    working_dir: /app/apps/api
    env_file: apps/api/.env
    environment:
      # Inside the compose network, reach postgres/redis by service name.
      DATABASE_URL: postgresql://spin:spin@postgres:5432/spin?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    command: sh -c "pnpm exec prisma migrate deploy && pnpm dev"
    depends_on:
      deps: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: spin-dev
    volumes: *app-volumes
    working_dir: /app/apps/web
    environment:
      # Next.js proxies /api/* to the api container (server-side).
      API_URL: http://api:4000
      # The browser connects to Socket.IO directly, via the published port.
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - "3000:3000"
    command: pnpm dev
    depends_on:
      deps: { condition: service_completed_successfully }
      api: { condition: service_started }

volumes:
  pgdata:
  node_modules:
  api_node_modules:
  web_node_modules:
  pnpm_store:
